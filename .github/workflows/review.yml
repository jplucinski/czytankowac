name: Review Forecast

on:
  repository_dispatch:
    types:
      - forecast-review-requested

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Parse dispatch payload
        run: |
          echo "PR_NUMBER=${{ github.event.client_payload.pr_number }}" >> "$GITHUB_ENV"
          echo "BRANCH=${{ github.event.client_payload.branch }}" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=${{ github.event.client_payload.head_sha }}" >> "$GITHUB_ENV"

      - name: Checkout forecast branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch }}

      - name: Verify PR head SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
          if [[ "$CURRENT_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Stale review payload: expected $EXPECTED_SHA, got $CURRENT_SHA"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build site
        run: npm run build

      - name: Run review agent
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
        run: |
          set +e
          npm run --silent review > review-output.json
          status=$?
          if [ "$status" -ne 0 ] && ! jq -e '.decision' review-output.json >/dev/null 2>&1; then
            echo "Review failed, retrying once..."
            sleep 30
            npm run --silent review > review-output.json
            status=$?
          fi
          echo "REVIEW_EXIT=$status" >> "$GITHUB_ENV"

      - name: Comment review result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        run: |
          export REVIEW_JSON="$(cat review-output.json)"
          bash scripts/comment-review.sh

      - name: Persist review artifact
        if: env.REVIEW_EXIT == '0'
        run: npx tsx scripts/persist-review.ts review-output.json

      - name: Commit review artifact
        if: env.REVIEW_EXIT == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/review.json
          if git diff --staged --quiet; then
            echo "Review metadata already committed; reusing current HEAD"
          else
            git commit -m "chore: add forecast review metadata"
            git push origin "$BRANCH"
          fi
          echo "MERGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Merge on PASS
        if: env.REVIEW_EXIT == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 15); do
            CURRENT_SHA="$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')"
            if [[ "$CURRENT_SHA" == "$MERGE_SHA" ]]; then
              break
            fi
            if [[ "$attempt" -eq 15 ]]; then
              echo "PR head $CURRENT_SHA did not converge to $MERGE_SHA before merge."
              exit 1
            fi
            echo "Waiting for PR head to update ($attempt/15): $CURRENT_SHA -> $MERGE_SHA"
            sleep 2
          done

          TITLE="$(npx tsx -e "
          import { readFileSync } from 'node:fs';
          import { ForecastSchema } from './src/domain/forecast.ts';
          import { toCommitSummary } from './src/domain/forecast-view.ts';
          const forecast = ForecastSchema.parse(JSON.parse(readFileSync('src/data/latest.json', 'utf8')));
          console.log('forecast: ' + toCommitSummary(forecast));
          ")"

          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f commit_title="$TITLE" \
            -f sha="$MERGE_SHA"

          ENCODED_BRANCH="${BRANCH//\//%2F}"
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ENCODED_BRANCH}" \
            || true

      - name: Dispatch deploy
        if: env.REVIEW_EXIT == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
